name = "daylight-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Secrets are NOT set here — they would end up in git. Set them with:
#   wrangler secret put JINA_API_KEY
[vars]
# Comma-separated list of origins allowed to call this worker.
# Leave empty to allow any origin (fine for first deploy; lock it down after).
ALLOWED_ORIGINS = ""

# Starts the feed build every 30 minutes (see `scheduled` in src/index.js).
# Inert until the GH_DISPATCH_TOKEN secret is set.
[triggers]
crons = ["2,32 * * * *"]

[observability]
enabled = true
