name: Runner survey (temporary)
on:
  push:
    branches: [claude/runner-survey]
jobs:
  partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --omit=dev
      - run: node research/partners-survey.mjs
